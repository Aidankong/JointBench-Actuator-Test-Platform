limits:
  # Conservative commissioning limits. Adjust after fixture and actuator review.
  # The adapter still limits the first target command to +/-5 deg.
  # Soft limits leave a small margin for normal settling behavior.
  min_position_deg: -6
  max_position_deg: 6
  max_speed_dps: 5
  max_current_a: 3
  max_temperature_c: 60
  max_following_error_deg: 2
  communication_timeout_ms: 500

safe_stop:
  strategy: quick_stop
  disable_after_stop: true
